[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "qsv2v"
version = "0.1.0"
description = "A simulation framework for quantum-safe authentication and key exchange in V2V networks"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "numpy>=1.26",
    "qiskit>=1.2",
    "qiskit-aer>=0.15",
    "ecdsa>=0.19",
    "cryptography>=42",
    "kyber-py>=1.0",
    "dilithium-py>=1.0",
    "simpy>=4.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5"]
# liboqs (C) via liboqs-python; builds liboqs with CMake on first import.
oqs = ["liboqs-python>=0.12"]

[tool.setuptools.packages.find]
include = ["qsv2v*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: long-running statistical tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "NPY"]
